[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-qa-augmentation"
version = "0.3.0"
description = "Biomedical instruction data augmentation for downstream knowledge distillation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.6,<3", "transformers==4.57.1", "peft==0.17.1", "accelerate>=1.0,<2", "bitsandbytes>=0.45,<0.49", "sentencepiece>=0.2", "protobuf>=4"]

[project.scripts]
biomedqa = "biomedqa.cli:main"

[tool.setuptools.packages.find]
include = ["biomedqa*"]

[tool.setuptools.package-data]
biomedqa = ["prompt_templates.json"]
